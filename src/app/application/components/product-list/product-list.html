<h2>Liste des produits</h2>
<table border="1">
  <tr>
    <th>Id</th>
    <th>Nom</th>
    <th>Prix</th>
  </tr>
  @for (p of products(); track p.id) {
    <tr>
      <td>{{p.id}}</td>
      <td>{{p.name}}</td>
      <td>{{p.price}}</td>
    </tr>
  }
</table>
<button (click)="onAddProduct()">Ajouter</button>
