<h1>Liste des produits</h1>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Id</th>
      <th>Nom</th>
      <th>Prix</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.price }} DT</td>
      </tr>
    }
  </tbody>
</table>
<button class="btn btn-primary" (click)="onAddProduct()">Ajouter</button>
