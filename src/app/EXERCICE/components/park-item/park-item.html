<div class="d-flex justify-content-between align-items-center">
  <div>
    <img [src]="park().photo" [alt]="park().name" width="60" height="60" class="me-1">
    Id: {{ park().id }} <b>{{ park().name }}</b>
    <span class="badge bg-primary">{{ park().nbLikes }} <i class="bi bi-hand-thumbs-up-fill"></i></span>
  </div>
  <div class="btn-group">
    <button class="btn btn-info" [routerLink]="['/parks', park().id]">
      <i class="bi bi-info-circle-fill"></i> Infos
    </button>
    <button class="btn btn-danger" (click)="onLike()">
      <i class="bi bi-heart-fill"></i> Likes
    </button>
    <button class="btn btn-secondary" (click)="onDelete()">
      <i class="bi bi-trash"></i> Supprimer
    </button>
  </div>
</div>
